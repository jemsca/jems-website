<!--
  ONHB How To — render widget
  Paste this whole file into an "ONHB HTML Widget" web part on a SharePoint page.
  It fetches the published Markdown (How-To.md) from this site's SiteAssets/Docs
  folder (same-origin, current-user context — no secrets) and renders it with a
  sticky sidebar table of contents.

  Source of truth: How To.md in the repo (jemsca/onhb). Publish with
  Publish-HowTo.ps1, which uploads it to SiteAssets/Docs/How-To.md.

  Bundled: marked v12.0.2 (MIT, https://github.com/markedjs/marked) — inlined so
  nothing external is loaded.
-->
<div id="onhb-howto">
  <div class="ht-bar">
    <span class="ht-title">ONHB How&nbsp;To</span>
    <input id="ht-filter" class="ht-filter" type="search" placeholder="Filter contents…" aria-label="Filter table of contents" />
    <span id="ht-updated" class="ht-updated"></span>
    <button id="ht-reload" class="ht-reload" title="Reload">↻</button>
  </div>
  <div class="ht-body">
    <nav id="ht-toc" class="ht-toc" aria-label="Table of contents"></nav>
    <article id="ht-content" class="ht-content">
      <p class="ht-status">Loading…</p>
    </article>
  </div>
</div>

<style>
  #onhb-howto{
    --ht-accent:#0f6cbd; --ht-bg:#fff; --ht-fg:#242424; --ht-muted:#616161;
    --ht-line:#e1e1e1; --ht-side:#faf9f8; --ht-hover:#f3f2f1; --ht-code:#f5f5f5;
    font-family:"Segoe UI",-apple-system,system-ui,Roboto,Helvetica,Arial,sans-serif;
    color:var(--ht-fg); background:var(--ht-bg); border:1px solid var(--ht-line);
    border-radius:8px; overflow:hidden; display:flex; flex-direction:column;
    height:85vh; min-height:480px;
  }
  #onhb-howto *{box-sizing:border-box;}
  .ht-bar{display:flex; align-items:center; gap:12px; padding:10px 14px;
    border-bottom:1px solid var(--ht-line); background:var(--ht-side); flex:0 0 auto;}
  .ht-title{font-weight:600; font-size:15px; white-space:nowrap;}
  .ht-filter{flex:0 1 240px; padding:5px 9px; border:1px solid var(--ht-line);
    border-radius:6px; font-size:13px; outline:none;}
  .ht-filter:focus{border-color:var(--ht-accent);}
  .ht-updated{margin-left:auto; color:var(--ht-muted); font-size:12px; white-space:nowrap;}
  .ht-reload{border:1px solid var(--ht-line); background:#fff; border-radius:6px;
    cursor:pointer; font-size:15px; line-height:1; padding:5px 9px; color:var(--ht-muted);}
  .ht-reload:hover{background:var(--ht-hover);}
  .ht-body{display:flex; flex:1 1 auto; min-height:0;}
  .ht-toc{flex:0 0 270px; overflow:auto; padding:12px 8px 24px; background:var(--ht-side);
    border-right:1px solid var(--ht-line); font-size:13px;}
  .ht-toc a{display:block; padding:3px 10px; color:var(--ht-fg); text-decoration:none;
    border-radius:5px; border-left:2px solid transparent; line-height:1.35;}
  .ht-toc a:hover{background:var(--ht-hover);}
  .ht-toc a.lvl1{font-weight:600; margin-top:8px;}
  .ht-toc a.lvl2{padding-left:22px; color:var(--ht-muted);}
  .ht-toc a.lvl3{padding-left:34px; color:var(--ht-muted); font-size:12px;}
  .ht-toc a.active{background:#eaf3fb; border-left-color:var(--ht-accent); color:var(--ht-accent);}
  .ht-toc a.hidden{display:none;}
  .ht-content{flex:1 1 auto; overflow:auto; padding:20px 30px 60px; scroll-behavior:smooth;}
  .ht-content h1{font-size:24px; margin:30px 0 10px; padding-bottom:6px; border-bottom:2px solid var(--ht-line);}
  .ht-content h1:first-child{margin-top:0;}
  .ht-content h2{font-size:19px; margin:26px 0 8px; color:#333;}
  .ht-content h3{font-size:16px; margin:18px 0 6px;}
  .ht-content p{margin:8px 0; line-height:1.55;}
  .ht-content ul,.ht-content ol{margin:6px 0 6px 4px; padding-left:22px; line-height:1.5;}
  .ht-content li{margin:2px 0;}
  .ht-content a{color:var(--ht-accent); text-decoration:none;}
  .ht-content a:hover{text-decoration:underline;}
  .ht-content code{background:var(--ht-code); padding:1px 5px; border-radius:4px;
    font-family:Consolas,"Courier New",monospace; font-size:0.9em;}
  .ht-content pre{background:var(--ht-code); padding:12px 14px; border-radius:6px;
    overflow:auto; border:1px solid var(--ht-line);}
  .ht-content pre code{background:none; padding:0;}
  .ht-content blockquote{margin:10px 0; padding:6px 14px; border-left:3px solid var(--ht-accent);
    background:var(--ht-side); color:#333;}
  .ht-content table{border-collapse:collapse; margin:12px 0; font-size:13px; display:block; overflow-x:auto;}
  .ht-content th,.ht-content td{border:1px solid var(--ht-line); padding:6px 10px; text-align:left; vertical-align:top;}
  .ht-content th{background:var(--ht-side);}
  .ht-content hr{border:none; border-top:1px solid var(--ht-line); margin:20px 0;}
  .ht-status{color:var(--ht-muted);} .ht-status.err{color:#a4262c;}
  @media (max-width:640px){
    #onhb-howto{height:auto;} .ht-body{flex-direction:column;}
    .ht-toc{flex:none; max-height:200px; border-right:none; border-bottom:1px solid var(--ht-line);}
    .ht-content{overflow:visible;}
  }
</style>

<script>
(function(){
  window.jemsWebsiteCapabilities = window.jemsWebsiteCapabilities || {};
  window.jemsWebsiteCapabilities.onhbHowTo = Object.freeze([
    "load_howto_markdown",
    "render_howto_markdown",
    "filter_howto_table_of_contents",
    "reload_howto_markdown",
  ]);

  var CONFIG = {
    // Server-relative path (under this site) where Publish-HowTo.ps1 puts the file.
    mdPath: "SiteAssets/Docs/How-To.md",
    // Force the site's server-relative URL if auto-detect fails on a modern page,
    // e.g. "/sites/Registration". Leave "" to auto-detect.
    siteUrl: "",
    // For local testing only: an absolute URL to a .md file. Leave "" on SharePoint.
    testUrl: ""
  };

  var contentEl = document.getElementById("ht-content");
  var tocEl = document.getElementById("ht-toc");
  var filterEl = document.getElementById("ht-filter");
  var updatedEl = document.getElementById("ht-updated");

  function webUrl(){
    if (CONFIG.siteUrl) return CONFIG.siteUrl.replace(/\/$/, "");
    var ctx = window._spPageContextInfo;
    var w = ctx && (ctx.webServerRelativeUrl || ctx.webAbsoluteUrl);
    if (w) {
      try { w = new URL(w, location.origin).pathname; } catch (e) {}
      return (w === "/") ? "" : w.replace(/\/$/, "");
    }
    // Modern pages often don't expose _spPageContextInfo: derive /sites/<x> or
    // /teams/<x> from the current path.
    var m = location.pathname.match(/^(\/(?:sites|teams)\/[^\/]+)/i);
    return m ? m[1] : "";
  }
  function apiUrl(op){
    var rel = webUrl() + "/" + CONFIG.mdPath;
    return webUrl() + "/_api/web/GetFileByServerRelativeUrl('" + rel + "')" + op;
  }
  function valueUrl(){ return CONFIG.testUrl || apiUrl("/$value"); }
  function propsUrl(){ return apiUrl("/TimeLastModified"); }

  function slug(text){
    return text.toLowerCase().replace(/[^\w\s-]/g,"").trim().replace(/\s+/g,"-") || "section";
  }

  function buildToc(){
    var used = {}, items = [];
    contentEl.querySelectorAll("h1,h2,h3").forEach(function(h){
      var base = slug(h.textContent), id = base, n = 2;
      while (used[id]) { id = base + "-" + (n++); }
      used[id] = true; h.id = id;
      var a = document.createElement("a");
      a.href = "#" + id; a.textContent = h.textContent;
      a.className = "lvl" + h.tagName.substring(1);
      a.addEventListener("click", function(e){
        e.preventDefault();
        h.scrollIntoView({behavior:"smooth", block:"start"});
        if (history.replaceState) history.replaceState(null,"","#"+id);
        setActive(a);
      });
      tocEl.appendChild(a);
      items.push({a:a, h:h});
    });
    return items;
  }

  var links = [];
  function setActive(a){
    links.forEach(function(x){ x.a.classList.toggle("active", x.a===a); });
  }

  function trackScroll(items){
    if (!("IntersectionObserver" in window)) return;
    var byId = {}; items.forEach(function(x){ byId[x.h.id] = x.a; });
    var obs = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (en.isIntersecting){
          var a = byId[en.target.id];
          if (a) setActive(a);
        }
      });
    }, {root:contentEl, rootMargin:"0px 0px -80% 0px", threshold:0});
    items.forEach(function(x){ obs.observe(x.h); });
  }

  filterEl.addEventListener("input", function(){
    var q = filterEl.value.toLowerCase();
    links.forEach(function(x){
      x.a.classList.toggle("hidden", q && x.a.textContent.toLowerCase().indexOf(q) === -1);
    });
  });

  function render(md){
    contentEl.innerHTML = marked.parse(md);
    tocEl.innerHTML = "";
    links = buildToc();
    trackScroll(links);
    if (location.hash){
      var t = contentEl.querySelector(location.hash);
      if (t) setTimeout(function(){ t.scrollIntoView({block:"start"}); }, 60);
    }
  }

  function fetchWithTimeout(url, opt, ms){
    opt = opt || {};
    var ctrl = ("AbortController" in window) ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, ms || 15000) : null;
    if (ctrl) opt.signal = ctrl.signal;
    return fetch(url, opt).then(function(r){
      if (timer) clearTimeout(timer); return r;
    }, function(err){
      if (timer) clearTimeout(timer);
      throw new Error(err && err.name === "AbortError"
        ? "timed out after " + (ms || 15000) + "ms" : (err && err.message || err));
    });
  }

  function load(){
    var url = valueUrl();
    contentEl.innerHTML = '<p class="ht-status">Loading…</p>';
    tocEl.innerHTML = "";
    if (window.console) console.log("[HowTo] fetching", url);
    fetchWithTimeout(url, {headers:{Accept:"text/plain"}, credentials:"same-origin"})
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status+" "+r.statusText); return r.text(); })
      .then(render)
      .catch(function(err){
        contentEl.innerHTML = '<p class="ht-status err"><b>Could not load How-To.md</b> ('+
          err.message+').<br>Tried: <code>'+url+'</code><br>'+
          'Check the file is published (run Publish-HowTo.ps1 &rarr; <code>'+CONFIG.mdPath+
          '</code>), and that the site path above is right (if not, set CONFIG.siteUrl).</p>';
        if (window.console) console.error("[HowTo] load failed:", err);
      });
    fetchWithTimeout(propsUrl(), {headers:{Accept:"application/json;odata=nometadata"}, credentials:"same-origin"}, 8000)
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){
        var t = j && (j.value || j.TimeLastModified);
        if (t) updatedEl.textContent = "Updated " + new Date(t).toLocaleDateString();
      }).catch(function(){});
  }

  document.getElementById("ht-reload").addEventListener("click", load);

  if (window.marked) { load(); }
  else { contentEl.innerHTML = '<p class="ht-status err">Markdown library failed to load.</p>'; }
})();
</script>
